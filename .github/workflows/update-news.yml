name: Update news feed

on:
  schedule:
    # Weekdays: early morning sweep, then pre-market and market-hour runs.
    # This UTC window covers both sides of the US daylight-saving calendar:
    #   EDT (roughly Mar-Nov): session 13:30-20:00 UTC -> buffer 13:00-20:30
    #   EST (roughly Nov-Mar): session 14:30-21:00 UTC -> buffer 14:00-21:30
    # i.e. 13:00-21:30 UTC covers the 30-min pre/post buffer year-round
    # (with a bit of extra slack on the side that isn't currently in DST).
    # 08:37 UTC catches overnight/European news, three hours before the
    # 11:37 UTC pre-market run; 06:37 UTC starts the day two hours
    # earlier, since GitHub's queue delays scheduled runs more and more.
    # Minutes are off :00/:30 on purpose: GitHub delays or drops scheduled
    # runs most at the busy top and half of the hour.
    - cron: '37 6 * * 1-5'
    - cron: '37 8 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '17 13 * * 1-5'
    - cron: '37 14 * * 1-5'
    - cron: '17 16 * * 1-5'
    - cron: '37 17 * * 1-5'
    - cron: '17 19 * * 1-5'
    - cron: '37 20 * * 1-5'
    - cron: '37 21 * * 1-5'
    # Weekends: two sweeps, roughly twelve hours apart.
    - cron: '37 3 * * 0,6'
    - cron: '17 15 * * 0,6'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Label the whole feed with one model (to check it works), or auto'
        type: choice
        options: [auto, DeepSeek, Gemini]
        default: auto
      full:
        description: 'Rebuild every daily page too (after a template or filter change)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # a hung run would hold every later one in the concurrency queue
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh news
        env:
          # Read from an encrypted repo secret only — never logged, never
          # committed. If the secret isn't set, fetch_news.py silently
          # falls back to the local keyword heuristic.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Fallback when DeepSeek doesn't answer; same rules. Unset = no
          # fallback. GEMINI_MODEL can be a repository variable or a secret.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          LLM_ONLY: ${{ inputs.provider }}
          # No MARKETSTACK_API_KEY here (2026-10-06): Marketstack counts every
          # symbol of a request against the plan, so a movers refresh of ~630
          # shares cost ~630 of the 10,000 a month. Without the key
          # market_movers.py keeps the stored movers as they are.
        run: python fetch_news.py

      # Archive + company/sector/daily pages, RSS and sitemap (site_build.py).
      # A failure here must not hold back the news update itself.
      - name: Build the SEO pages
        continue-on-error: true
        run: python site_build.py --changed-urls "$RUNNER_TEMP/changed-urls.txt" ${{ inputs.full && '--full' || '' }}

      - name: Commit updated news_data.js
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # every folder site_build.py writes pages into, or a new page never reaches the site
          git add news_data.js watchlist_candidates.txt data/archive data/movers.json index.html news mood sitemap.xml \
            insider-buying insider-selling import portfolio-tracker dividend-tracker price-alerts tools why-pulsarium
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update news feed [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow (Bing, Yandex, Seznam...) fetches the changed pages right
      # away; wait for GitHub Pages to publish the push first.
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/changed-urls.txt" ]; then
            sleep 90
            python site_build.py --indexnow "$RUNNER_TEMP/changed-urls.txt"
          fi
