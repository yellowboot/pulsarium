name: Update news feed

on:
  # Started on the minute by the database scheduler (Supabase pg_cron, migration
  # 20261013090000_cron_dispatch_github in investor-platform) through
  # workflow_dispatch: GitHub's own schedule ran 20-100 minutes late on
  # weekdays, hours late on weekends, and dropped morning runs. Times (UTC):
  # weekdays 06:37, 08:37, 11:37, 13:17, 14:37, 16:17, 17:37, 19:17, 20:37, 21:37;
  # weekends 03:37 and 15:17.
  workflow_dispatch:
    inputs:
      provider:
        description: 'Label the whole feed with one model (to check it works), or auto'
        type: choice
        options: [auto, DeepSeek, Gemini]
        default: auto
      full:
        description: 'Rebuild every daily page too (after a template or filter change)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # Remove only older news snapshot caches.

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SEC_READ_CACHE: .cache/sec/news-snapshots.sqlite3
    # a hung run would hold every later one in the concurrency queue
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore SEC snapshots for the page builder
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/sec/news-snapshots.sqlite3
          key: news-sec-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-sec-v1-${{ runner.os }}-

      - name: Fetch fresh news
        env:
          # Read from an encrypted repo secret only — never logged, never
          # committed. If the secret isn't set, fetch_news.py silently
          # falls back to the local keyword heuristic.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Fallback when DeepSeek doesn't answer; same rules. Unset = no
          # fallback. GEMINI_MODEL can be a repository variable or a secret.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          LLM_ONLY: ${{ inputs.provider }}
          # No MARKETSTACK_API_KEY here (2026-10-06): Marketstack counts every
          # symbol of a request against the plan, so a movers refresh of ~630
          # shares cost ~630 of the 10,000 a month. Without the key
          # market_movers.py keeps the stored movers as they are.
        run: python fetch_news.py

      # Archive + company/sector/daily pages, RSS and sitemap (site_build.py).
      # A failure here must not hold back the news update itself.
      - name: Build the SEO pages
        continue-on-error: true
        run: python site_build.py --changed-urls "$RUNNER_TEMP/changed-urls.txt" ${{ inputs.full && '--full' || '' }}

      - name: Bound the SEC snapshot cache
        id: prepare_cache
        if: always()
        continue-on-error: true
        run: python scripts/sec/sec_read_cache.py
      - name: Save SEC snapshots for the page builder
        id: save_cache
        if: always() && steps.prepare_cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/sec/news-snapshots.sqlite3
          key: news-sec-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep only two news snapshot caches
        if: always() && steps.save_cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sec/prune_read_caches.py news-sec-v1-
      - name: Commit updated news_data.js
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # every folder site_build.py writes pages into, or a new page never reaches the site
          git add news_data.js watchlist_candidates.txt data/archive data/movers.json index.html news mood sitemap.xml \
            insider-buying insider-selling sector-analytics report-highlights import portfolio-tracker dividend-tracker price-alerts tools why-pulsarium
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update news feed [skip ci]"
            # someone may have pushed during the run; replay on top of it (a real
            # conflict still stops here, as before)
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow (Bing, Yandex, Seznam...) fetches the changed pages right
      # away; wait for GitHub Pages to publish the push first.
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/changed-urls.txt" ]; then
            sleep 90
            python site_build.py --indexnow "$RUNNER_TEMP/changed-urls.txt"
          fi
