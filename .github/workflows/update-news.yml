name: Update news feed

on:
  schedule:
    # Weekdays: early morning sweep, then pre-market and market-hour runs.
    # This UTC window covers both sides of the US daylight-saving calendar:
    #   EDT (roughly Mar-Nov): session 13:30-20:00 UTC -> buffer 13:00-20:30
    #   EST (roughly Nov-Mar): session 14:30-21:00 UTC -> buffer 14:00-21:30
    # i.e. 13:00-21:30 UTC covers the 30-min pre/post buffer year-round
    # (with a bit of extra slack on the side that isn't currently in DST).
    # 08:30 UTC catches overnight/European news, three hours before the
    # existing 11:30 UTC pre-market run.
    - cron: '30 8 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '30 21 * * 1-5'
    # Weekends: two sweeps, roughly twelve hours apart.
    - cron: '30 3 * * 0,6'
    - cron: '0 15 * * 0,6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh news
        env:
          # Read from an encrypted repo secret only — never logged, never
          # committed. If the secret isn't set, fetch_news.py silently
          # falls back to the local keyword heuristic.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python fetch_news.py

      # Archive + company/sector/daily pages, RSS and sitemap (site_build.py).
      # A failure here must not hold back the news update itself.
      - name: Build the SEO pages
        continue-on-error: true
        run: python site_build.py --changed-urls "$RUNNER_TEMP/changed-urls.txt"

      - name: Commit updated news_data.js
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.js watchlist_candidates.txt data/archive news mood sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update news feed [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow (Bing, Yandex, Seznam...) fetches the changed pages right
      # away; wait for GitHub Pages to publish the push first.
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/changed-urls.txt" ]; then
            sleep 90
            python site_build.py --indexnow "$RUNNER_TEMP/changed-urls.txt"
          fi
